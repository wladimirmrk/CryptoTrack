# Detekt: минимальная конфигурация Phase 2. Ужесточение — Phase 11 (development-plan).
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    active: false # Compose-компоненты закономерно имеют много параметров
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15

style:
  MagicNumber:
    active: false # размеры/цвета в Compose-коде
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeRawStrings: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*' # Compose-константы в camelCase
  ConstructorParameterNaming:
    ignoreAnnotated:
      - Serializable # DTO зеркалят JSON-поля API (snake_case)

# Phase 11: форматтер-правила включены точечно (ktlint-плагин в проект не заводим —
# стандарт качества detekt+lint; правила ktlint-семейства детектируются detekt-formatting).
formatting:
  active: true
  # Обёртки/отступы — контекст Compose-кода, остаются вне гейта:
  ArgumentListWrapping:
    active: false
  Indentation:
    active: false
  MaximumLineLength:
    active: false # MaxLineLength в style (120) покрывает
  ParameterListWrapping:
    active: false
  PropertyWrapping:
    active: false
  AnnotationOnSeparateLine:
    active: false
  AnnotationSpacing:
    active: false
  ChainWrapping:
    active: false
  CommentSpacing:
    active: false
  Filename:
    active: false
  ImportOrdering:
    active: false
  MultiLineIfElse:
    active: false
  NoLineBreakAfterElse:
    active: false
  NoLineBreakBeforeAssignment:
    active: false
  UnnecessaryParentheses:
    active: false
  # Ложные срабатывания на Kotlin 2.3: встроенный в detekt 1.23.8 ktlint старее
  # и помечает реально используемые импорты (проверено на кодовой базе 2026-09).
  NoUnusedImports:
    active: false
