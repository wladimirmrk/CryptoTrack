# Detekt: минимальная конфигурация Phase 2. Ужесточение — Phase 11 (development-plan).
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    active: false # Compose-компоненты закономерно имеют много параметров
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15

style:
  MagicNumber:
    active: false # размеры/цвета в Compose-коде
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeRawStrings: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*' # Compose-константы в camelCase
  ConstructorParameterNaming:
    ignoreAnnotated:
      - Serializable # DTO зеркалят JSON-поля API (snake_case)

formatting:
  active: false # форматтер-источник — ktlint CLI 1.8 (верификация добавится в Phase 11); встроенный ktlint detekt 1.23.8 старее и расходится
