# Detekt: минимальная конфигурация Phase 1. Ужесточение — Phase 11 (development-plan).
build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 120
  LongParameterList:
    active: false # Compose-компоненты закономерно имеют много параметров

style:
  MagicNumber:
    active: false # размеры/цвета в Compose-коде
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeRawStrings: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][A-Za-z0-9]*|[A-Z][_A-Z0-9]*' # Compose-константы в camelCase
